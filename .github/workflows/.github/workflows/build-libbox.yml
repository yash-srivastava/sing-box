name: Build libbox.aar (Android AAR)

on:
  workflow_dispatch: # Allows manual trigger from the GitHub Actions tab
  push:
    branches: [ dev-next, main ] # Triggers on push to these branches

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # FIXED: Required for 'git describe' to find tags
          fetch-tags: true  # FIXED: Ensures tags are available for versioning

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22' # Sing-box 1.11+ requires 1.21 or newer

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c # Recommended version for gomobile

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          # Note: gomobile init is handled during bind in newer versions, 
          # but explicitly calling it ensures toolchain readiness.
          $(go env GOPATH)/bin/gomobile init

      - name: Build libbox.aar
        run: |
          # Fix for 'dubious ownership' in git
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          
          # Build Command with necessary tags for WireGuard/WARP
          gomobile bind -v -androidapi 21 \
            -tags "with_wireguard with_quic with_dhcp with_dns" \
            -ldflags="-s -w" \
            ./experimental/libbox

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: libbox-android-sdk
          path: |
            libbox.aar
            libbox-sources.jar
