name: Build libbox.aar (Android AAR)

on:
  workflow_dispatch:
  push:
    branches: [ dev-next ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (with tags)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Ensure git present
        run: sudo apt-get update && sudo apt-get install -y git

      - name: Unshallow & fetch tags (defensive)
        run: |
          if [ -f .git/shallow ]; then git fetch --unshallow || true; fi
          git fetch --tags --prune

      - name: Build libbox AAR
        run: make lib_android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: clients/android/app/libs/*.aar
