name: build-libbox-aar
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Install NDK (via sdkmanager) and deps
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip wget
          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip -O cmdline-tools.zip
          mkdir -p $HOME/Android/cmdline-tools
          unzip -q cmdline-tools.zip -d $HOME/Android/cmdline-tools
          export ANDROID_SDK_ROOT=$HOME/Android
          yes | $ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT "ndk;25.2.9519653"

      - name: Build libbox AAR
        run: |
          export ANDROID_SDK_ROOT=$HOME/Android
          export ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/25.2.9519653
          make lib_android || go run ./cmd/internal/build_libbox -target android

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: clients/android/app/libs/*.aar
